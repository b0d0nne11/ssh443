global
    log stdout format raw local0 info

defaults
    mode tcp
    log global
    option tcplog
    timeout connect 5s
    timeout client 30s
    timeout server 30s

frontend tls443
    bind :443 ssl crt /certs/home.pem
    # Wait (up to 3s) for the client's first bytes, then route on them.
    # SSH clients always open with "SSH-2.0-"; any valid HTTP request is longer
    # than 7 bytes. Clients that send nothing fall through to web after 3s.
    tcp-request inspect-delay 3s
    tcp-request content accept if { req.len ge 7 }
    acl is_ssh req.payload(0,7) -m bin 5353482d322e30   # "SSH-2.0"
    use_backend ssh if is_ssh
    default_backend web

backend ssh
    timeout tunnel 1h
    server sshd sshd:22

backend web
    server web web:8080 send-proxy
