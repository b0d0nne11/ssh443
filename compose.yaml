name: ssh443

services:

  init:
    build: ./init
    network_mode: none
    volumes:
      - ./secrets:/secrets

  haproxy:
    image: haproxy:3.2-alpine
    ports:
      - "127.0.0.1:8443:443"
    volumes:
      - ./haproxy/haproxy.cfg:/usr/local/etc/haproxy/haproxy.cfg:ro
      - ./secrets/certs:/certs:ro
    depends_on:
      init:
        condition: service_completed_successfully
      sshd:
        condition: service_started
      web:
        condition: service_started

  sshd:
    build: ./sshd
    volumes:
      - ./secrets/ssh:/secrets:ro
    depends_on:
      init:
        condition: service_completed_successfully

  web:
    image: nginx:1.28-alpine
    volumes:
      - ./web/nginx.conf:/etc/nginx/conf.d/default.conf:ro
      - ./web/html:/usr/share/nginx/html:ro
